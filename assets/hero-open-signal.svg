<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-labelledby="title desc">
  <title id="title">Open Signal field study</title>
  <desc id="desc">An architectural plan connects content, a display, a visitor response and proof through one live signal.</desc>
  <style>
    .paper{stroke:#f3f0e8}.muted{stroke:#f3f0e8;opacity:.28}.signal{stroke:#ff5c35}.live{fill:#b9ff66}
    .flow{stroke-dasharray:14 10;animation:flow 9s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-240}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect x="1" y="1" width="618" height="618" rx="2" fill="#0e1d1b" stroke="#f3f0e8" stroke-opacity=".18"/>
  <g fill="none" stroke-width="1">
    <path class="muted" d="M52 0v620M155 0v620M258 0v620M361 0v620M464 0v620M567 0v620M0 52h620M0 155h620M0 258h620M0 361h620M0 464h620M0 567h620"/>
  </g>
  <g font-family="Courier New,monospace" font-size="12" letter-spacing="2.4">
    <text x="30" y="35" fill="#ff5c35">FIELD STUDY / 01</text>
    <text x="478" y="35" fill="#f3f0e8" opacity=".55">SPACE 07</text>
  </g>

  <!-- The physical space: intentionally incomplete, like the Open Signal mark. -->
  <g fill="none" stroke-linecap="square">
    <path class="paper" stroke-width="4" d="M76 116h153M274 116h190v76M464 238v202H342M296 440H76V318M76 272V116"/>
    <path class="muted" stroke-width="2" d="M229 116v76h67v-76M76 318h87v122M464 238h-96v76h96M163 318h75M282 318h86"/>
    <path class="muted" stroke-width="1.5" d="M229 192a37 37 0 0 1-37-37M296 192a37 37 0 0 0 37-37M163 318a34 34 0 0 0 34 34M368 314a38 38 0 0 1-38 38"/>
  </g>

  <!-- Display -->
  <g transform="translate(100 142)">
    <rect width="96" height="62" rx="2" fill="#132321" stroke="#f3f0e8" stroke-width="3"/>
    <path d="M15 35h20l9-17 12 30 9-13h17" fill="none" stroke="#ff5c35" stroke-width="3"/>
    <path d="M39 71h18M48 62v9" stroke="#f3f0e8" stroke-width="3"/>
  </g>

  <!-- Sensor and person -->
  <g transform="translate(392 274)" fill="none">
    <circle r="20" stroke="#b9ff66" stroke-width="2"/>
    <circle r="32" stroke="#b9ff66" stroke-width="1" opacity=".45"/>
    <circle r="45" stroke="#b9ff66" stroke-width="1" opacity=".22"/>
    <circle r="4" class="live"/>
  </g>
  <g transform="translate(261 292)" fill="none" stroke="#f3f0e8" stroke-width="3">
    <circle cy="-24" r="10"/>
    <path d="M0-14v38M-17 5H17M0 24l-15 28M0 24l15 28"/>
  </g>

  <!-- One signal, observable from source to proof. -->
  <path class="signal flow" d="M57 234H148C205 234 197 278 245 278H392C439 278 430 354 483 354h75" fill="none" stroke-width="4"/>
  <circle cx="57" cy="234" r="7" fill="#ff5c35"/>
  <circle cx="558" cy="354" r="7" fill="#b9ff66"/>
  <g transform="translate(474 376)">
    <rect width="90" height="58" rx="2" fill="#f3f0e8"/>
    <path d="M14 17h49M14 29h62M14 41h35" stroke="#0b1716" stroke-width="3"/>
    <circle cx="74" cy="17" r="5" fill="#ff5c35"/>
  </g>

  <g font-family="Courier New,monospace" font-size="11" letter-spacing="1.6" fill="#f3f0e8">
    <text x="95" y="103">DISPLAY</text>
    <text x="368" y="217">SENSOR</text>
    <text x="235" y="375">RESPONSE</text>
    <text x="474" y="454">PROOF</text>
  </g>
  <g transform="translate(30 545)" font-family="Courier New,monospace">
    <text y="0" fill="#f3f0e8" font-size="13" letter-spacing="1.5">ONE EVENT, OBSERVED END TO END.</text>
    <text y="34" fill="#ff5c35" font-size="11" letter-spacing="2">CONTENT / DISPLAY / RESPONSE / PROOF</text>
  </g>
</svg>
